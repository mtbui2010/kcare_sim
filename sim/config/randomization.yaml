# Per-episode randomization for sim data generation (randomize.py).
# Ranges are uniform [lo, hi] unless noted. Placement offsets are relative to
# the nominal ready-pose placement in task_open_drawer.yaml.

placement:
  yaw_deg: [-8, 8]           # cabinet turned about z
  lateral: [-0.05, 0.05]     # along the cabinet front [m]
  depth: [-0.04, 0.04]       # toward / away from the robot [m]
drawer0: [0.0, 0.02]         # target drawer already slightly open [m]

head_jitter_deg:             # real moveh does not land exactly
  pan: [-3, 3]
  tilt: [-3, 3]

# carcass colour families (RGB 0..1); each episode picks one and jitters it
cabinet_palettes:
  white:      [0.93, 0.92, 0.88]
  cream:      [0.90, 0.85, 0.74]
  light_gray: [0.75, 0.76, 0.78]
  light_wood: [0.78, 0.62, 0.45]
  dark_wood:  [0.45, 0.32, 0.22]
  dark_gray:  [0.32, 0.34, 0.37]
color_jitter: 0.05
front_delta: [-0.04, 0.06]   # drawer fronts slightly lighter/darker than the carcass
handle_gray: [0.40, 0.72]    # "gray handle"

floor_palettes:
  gray:  [[0.55, 0.55, 0.52], [0.48, 0.48, 0.45]]
  beige: [[0.72, 0.66, 0.56], [0.64, 0.58, 0.49]]
  wood:  [[0.55, 0.40, 0.27], [0.48, 0.34, 0.22]]
  dark:  [[0.30, 0.30, 0.32], [0.25, 0.25, 0.27]]

light:
  azimuth_deg: [0, 360]
  elevation_deg: [35, 80]
  diffuse: [0.35, 0.8]
  ambient: [0.2, 0.45]
  headlight: [0.25, 0.6]
