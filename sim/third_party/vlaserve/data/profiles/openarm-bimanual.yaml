name: openarm-bimanual
fps: 30
# Robot-side names are placeholders: replace them with your camera driver's names.
cameras:
  base: base
  left_wrist: left_wrist
  right_wrist: right_wrist
state_dim: 16
action_dim: 16
action_names: [right_joint_1.pos, right_joint_2.pos, right_joint_3.pos, right_joint_4.pos,
               right_joint_5.pos, right_joint_6.pos, right_joint_7.pos, right_gripper.pos,
               left_joint_1.pos, left_joint_2.pos, left_joint_3.pos, left_joint_4.pos,
               left_joint_5.pos, left_joint_6.pos, left_joint_7.pos, left_gripper.pos]
notes: >-
  Bimanual OpenArm as used by KETI-IRRC/pi05_openarm_* checkpoints. fps is an assumption:
  confirm against the dataset the checkpoint was trained on.
